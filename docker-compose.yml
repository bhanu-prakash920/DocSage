# docker compose up --build           -> DocSage on http://localhost:8000
# docker compose --profile local up   -> also starts Ollama for fully local models
services:
  docsage:
    build:
      context: .
      args:
        EXTRAS: ""          # add "local" for on-device embeddings (pulls PyTorch, ~2 GB)
    image: docsage:latest
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      DOCSAGE_DATA_DIR: /data
      DOCSAGE_OLLAMA_BASE_URL: http://ollama:11434
    volumes:
      - docsage-data:/data
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    profiles: ["local"]
    volumes:
      - ollama-models:/root/.ollama
    ports:
      - "11434:11434"
    restart: unless-stopped

volumes:
  docsage-data:
  ollama-models:
