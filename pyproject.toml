[project]
name = "docsage"
version = "1.0.0"
description = "DocSage: multimodal agentic document intelligence. Ask questions across documents and get cited answers grounded in text, tables and figures."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "anthropic>=0.70",
  "beautifulsoup4>=4.12",
  "chromadb>=1.0",
  "fastapi>=0.115",
  "google-genai>=1.30",
  "httpx>=0.27",
  "langgraph>=1.0",
  "numpy>=1.26",
  "openai>=1.100",
  "pillow>=10.4",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "pymupdf>=1.26",
  "pymupdf4llm>=0.0.27",
  "python-docx>=1.1",
  "python-dotenv>=1.0",
  "python-multipart>=0.0.9",
  "python-pptx>=1.0",
  "rank-bm25>=0.2.2",
  "rich>=13.7",
  "tavily-python>=0.5",
  "tenacity>=8.5",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
local = ["sentence-transformers>=3.0"]
ocr = ["img2table[easyocr]>=1.4", "opencv-python-headless>=4.10"]
llamaparse = ["llama-parse>=0.6"]
docling = ["docling>=2.0"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11", "types-requests"]

[project.scripts]
docsage = "docsage.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["docsage"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["web", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003", "B008", "SIM108", "RUF012"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = false
exclude = ["web/", "data/", "tests/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[[tool.mypy.overrides]]
module = ["pymupdf", "pymupdf.*", "pymupdf4llm", "pymupdf4llm.*", "docx", "docx.*", "pptx", "pptx.*"]
follow_imports = "skip"
